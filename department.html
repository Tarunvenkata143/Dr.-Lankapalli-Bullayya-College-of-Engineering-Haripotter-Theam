<!DOCTYPE html>

<body>
<!-- Page Loader -->
<div id="pageLoader" class="page-loader">
    <h1 class="loader-text">Dr. Lankapalli Bullayya College of Engineering</h1>
    <div class="magic-underline"></div>
</div>

<header class="site-header small">
    <div class="container header-inner">
        <div class="brand">
            <svg viewBox="0 0 200 200" width="56" height="56" xmlns="http://www.w3.org/2000/svg" class="animated-logo">
                <defs>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                        <feMerge>
                            <feMergeNode in="coloredBlur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#f0d18b;stop-opacity:1" />
                        <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
                        <stop offset="100%" style="stop-color:#8b7a2e;stop-opacity:1" />
                    </linearGradient>
                    <radialGradient id="cyanGradient" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.6" />
                        <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
                    </radialGradient>
                </defs>
                <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="3" class="logo-circle" filter="url(#glow)"/>
                <g class="logo-inner" transform="translate(100, 100)">
                    <circle cx="0" cy="-70" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="50" cy="-50" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="70" cy="0" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="50" cy="50" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="0" cy="70" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="-50" cy="50" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="-70" cy="0" r="4" fill="url(#goldGradient)" class="logo-star"/>
                    <circle cx="-50" cy="-50" r="4" fill="url(#goldGradient)" class="logo-star"/>
                </g>
                <path d="M 100 40 L 130 60 L 130 110 Q 100 140 100 140 Q 100 140 70 110 L 70 60 Z" fill="none" stroke="url(#goldGradient)" stroke-width="2" filter="url(#glow)"/>
                <path d="M 100 50 L 120 65 L 120 105 Q 100 130 100 130 Q 100 130 80 105 L 80 65 Z" fill="rgba(212, 175, 55, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5"/>
                <g transform="translate(100, 85)">
                    <rect x="-12" y="-8" width="8" height="16" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
                    <rect x="-4" y="-8" width="8" height="16" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
                    <rect x="4" y="-8" width="8" height="16" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
                    <line x1="15" y1="-15" x2="20" y2="-20" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
                    <line x1="18" y1="-8" x2="25" y2="-8" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
                    <line x1="16" y1="0" x2="22" y2="5" stroke="#00ffff" stroke-width="1.5" opacity="0.6"/>
                </g>
                <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
                <circle cx="100" cy="100" r="95" fill="url(#cyanGradient)" filter="url(#glow)"/>
            </svg>
            <div>
                <h1 id="deptTitle">Department</h1>
                <p class="tag">Dr. LBCE — Explore the Order</p>
            </div>
        </div>
        <nav class="main-nav">
            <a href="index.html">Home</a>
            <a href="departments.html">Departments</a>
            <a href="results.html">Results</a>
        </nav>
    </div>
</header>

<main>
    <!-- Department Hero Banner with Animations -->
    <section id="deptHero" class="dept-hero">
        <div id="heroAnimationContainer" class="hero-animation-container"></div>
        <div class="dept-hero-inner">
            <h2 id="deptHeroTitle"></h2>
            <p id="deptHeroSubtitle"></p>
        </div>
    </section>

    <div class="container content">
        <!-- About Section -->
        <section class="dept-about">
            <h3>About the Order</h3>
            <p id="deptDescription"></p>
        </section>

        <!-- Magical Subjects Grid -->
        <section class="dept-subjects">
            <h3>Magical Subjects</h3>
            <div class="subject-grid">
                <ul id="subjects"></ul>
            </div>
        </section>

        <!-- Department Features -->
        <section class="dept-features" id="deptFeaturesSection">
            <h3>Order Features</h3>
            <div class="features-grid" id="featuresGrid"></div>
        </section>

        <p><a href="departments.html" class="ghost">← Back to Departments</a></p>
    </div>
</main>

<footer class="site-footer">
    <div class="container">
        <p>© 2026 Dr. Lankapalli Bullayya College of Engineering</p>

 </footer>
