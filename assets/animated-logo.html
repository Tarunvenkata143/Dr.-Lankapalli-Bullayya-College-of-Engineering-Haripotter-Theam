<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; padding: 0; }
        svg { display: block; }
        
        /* Magical glow animation */
        @keyframes magical-glow {
            0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4)); }
            50% { opacity: 1; filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.8)) drop-shadow(0 0 40px rgba(0, 255, 255, 0.3)); }
        }
        
        /* Sparkle animation */
        @keyframes sparkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }
        
        /* Rotate animation */
        @keyframes rotate-slow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Drawing effect */
        @keyframes draw-stroke {
            0% { stroke-dashoffset: 1000; opacity: 0; }
            50% { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }
        
        .logo-circle { animation: magical-glow 3s ease-in-out infinite; }
        .logo-star { animation: sparkle 2s ease-in-out infinite; }
        .logo-inner { animation: rotate-slow 20s linear infinite; }
        .logo-text { animation: magical-glow 3s ease-in-out infinite; }
        
        .sparkle-1 { animation: sparkle 1.5s ease-in-out infinite; animation-delay: 0s; }
        .sparkle-2 { animation: sparkle 1.5s ease-in-out infinite; animation-delay: 0.5s; }
        .sparkle-3 { animation: sparkle 1.5s ease-in-out infinite; animation-delay: 1s; }
    </style>
</head>
<body>
<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        
        <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0d18b;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#d4af37;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8b7a2e;stop-opacity:1" />
        </linearGradient>
        
        <radialGradient id="cyanGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#00ffff;stop-opacity:0.6" />
            <stop offset="100%" style="stop-color:#00ffff;stop-opacity:0" />
        </radialGradient>
    </defs>
    
    <!-- Background circle with glow -->
    <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="3" class="logo-circle" filter="url(#glow)"/>
    
    <!-- Inner rotating circle -->
    <g class="logo-inner" transform="translate(100, 100)">
        <!-- Decorative stars around circle -->
        <circle cx="0" cy="-70" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="50" cy="-50" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="70" cy="0" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="50" cy="50" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="0" cy="70" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="-50" cy="50" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="-70" cy="0" r="4" fill="url(#goldGradient)" class="logo-star"/>
        <circle cx="-50" cy="-50" r="4" fill="url(#goldGradient)" class="logo-star"/>
    </g>
    
    <!-- Central magical shield shape -->
    <path d="M 100 40 L 130 60 L 130 110 Q 100 140 100 140 Q 100 140 70 110 L 70 60 Z" 
          fill="none" stroke="url(#goldGradient)" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Inner shield detail -->
    <path d="M 100 50 L 120 65 L 120 105 Q 100 130 100 130 Q 100 130 80 105 L 80 65 Z" 
          fill="rgba(212, 175, 55, 0.1)" stroke="url(#goldGradient)" stroke-width="1.5"/>
    
    <!-- Central magical symbol - Book/Wand -->
    <g transform="translate(100, 85)">
        <!-- Book pages -->
        <rect x="-12" y="-8" width="8" height="16" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
        <rect x="-4" y="-8" width="8" height="16" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
        <rect x="4" y="-8" width="8" height="16" fill="none" stroke="url(#goldGradient)" stroke-width="1.5"/>
        
        <!-- Wand sparkle -->
        <line x1="15" y1="-15" x2="20" y2="-20" stroke="#00ffff" stroke-width="1.5" opacity="0.6" class="sparkle-1"/>
        <line x1="18" y1="-8" x2="25" y2="-8" stroke="#00ffff" stroke-width="1.5" opacity="0.6" class="sparkle-2"/>
        <line x1="16" y1="0" x2="22" y2="5" stroke="#00ffff" stroke-width="1.5" opacity="0.6" class="sparkle-3"/>
    </g>
    
    <!-- Outer decorative ring -->
    <circle cx="100" cy="100" r="85" fill="none" stroke="url(#goldGradient)" stroke-width="1" stroke-dasharray="5,5" opacity="0.5"/>
    
    <!-- Magical aura -->
    <circle cx="100" cy="100" r="95" fill="url(#cyanGradient)" filter="url(#glow)"/>
    
    <!-- Text: Dr. LBCE -->
    <text x="100" y="155" font-family="'Cinzel', serif" font-size="16" font-weight="bold" 
          text-anchor="middle" fill="url(#goldGradient)" class="logo-text" filter="url(#glow)">
        Dr. LBCE
    </text>
</svg>
</body>
</html>
